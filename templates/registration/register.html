{% extends 'base.html' %}
{% block title %}Sign Up | ThreadLine{% endblock %}
{% block content %}
<div class="container my-5"><div class="row justify-content-center"><div class="col-lg-5 col-md-7">
  <div class="panel">
    <h2 class="text-center mb-1">Create Your Account</h2>
    <p class="text-center mb-4" style="color:var(--muted)">Join ThreadLine in a few seconds.</p>
    <form method="post">{% csrf_token %}
      {% include 'partials/form_fields.html' %}
      <button class="btn btn-accent btn-lg w-100">Sign Up</button>
    </form>
    <hr class="my-4">
    <p class="text-center mb-0" style="color:var(--muted)">
      Already have an account? <a href="{% url 'login' %}"><strong>Login</strong></a></p>
  </div>
</div></div></div>
{% endblock %}
