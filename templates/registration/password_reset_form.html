{% extends 'base.html' %}
{% block title %}Reset Password | ThreadLine{% endblock %}
{% block content %}
<div class="container my-5"><div class="row justify-content-center"><div class="col-lg-5 col-md-7">
  <div class="panel">
    <h2 class="text-center mb-1">Reset Password</h2>
    <p class="text-center mb-4" style="color:var(--muted)">Enter your email and we will send you a reset link.</p>
    <form method="post">{% csrf_token %}
      {% include 'partials/form_fields.html' %}
      <button class="btn btn-accent btn-lg w-100">Send Reset Link</button>
    </form>
    <hr class="my-4">
    <p class="text-center mb-0" style="color:var(--muted)">
      Remembered it? <a href="{% url 'login' %}"><strong>Login</strong></a></p>
  </div>
</div></div></div>
{% endblock %}
